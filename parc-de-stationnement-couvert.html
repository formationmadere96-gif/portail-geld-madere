<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parc de stationnement couvert · Portail GELD</title>
<style>
body { margin: 0; background: #101820; color: #f4f7fa; font: 16px system-ui, sans-serif; }
header, #status { padding: 1rem; }
h1 { font-size: 1.2rem; margin: .5rem 0; }
a { color: #ffd196; }
iframe { width: 100%; height: 85vh; border: 0; background: #fff; }
</style>
</head>
<body>
<header>
  <a href="fiches.html">Retour aux fiches</a>
  <h1>PARC DE STATIONNEMENT COUVERT</h1>
  <a id="download" download="PSC.pdf" hidden>Télécharger le PDF</a>
</header>
<p id="status" role="status">Chargement du PDF…</p>
<noscript>Activez JavaScript pour afficher ou télécharger le PDF.</noscript>
<iframe id="viewer" title="Parc de stationnement couvert" hidden></iframe>
<script>
const status = document.getElementById("status");
const download = document.getElementById("download");
const viewer = document.getElementById("viewer");

async function loadPdf() {
  const parts = await Promise.all([1, 2, 3].map(async number => {
    const response = await fetch(`psc-data/part-${number}.bin`);
    if (!response.ok) throw new Error("Impossible de charger le PDF");
    return response.arrayBuffer();
  }));
  if (parts.reduce((total, part) => total + part.byteLength, 0) !== 6454055) {
    throw new Error("PDF incomplet");
  }
  const url = URL.createObjectURL(new Blob(parts, {type: "application/pdf"}));
  download.href = url;
  download.hidden = false;
  viewer.src = url;
  viewer.hidden = false;
  status.hidden = true;
}

loadPdf().catch(() => {
  status.textContent = "Le PDF n’a pas pu être chargé. Actualisez la page pour réessayer.";
});
</script>
</body>
</html>
